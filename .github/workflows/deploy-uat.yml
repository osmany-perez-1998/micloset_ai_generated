name: Deploy — UAT

on:
  push:
    branches: [uat]

jobs:
  deploy-uat:
    name: Deploy to UAT Environment
    runs-on: ubuntu-latest
    environment: uat   # requires manual approval in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: uat-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/micloset-backend:$IMAGE_TAG ./backend
          docker push $ECR_REGISTRY/micloset-backend:$IMAGE_TAG

      - name: Build & push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: uat-${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/micloset-frontend:$IMAGE_TAG ./frontend
          docker push $ECR_REGISTRY/micloset-frontend:$IMAGE_TAG
